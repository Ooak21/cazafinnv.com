<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · CAZA FINNANCIAL desk</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/caza-logo-dark.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#14171C; --soft:#5E6772; --paper:#FFFFFF; --line:#E8EAEE; --bad:#9b3b32; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#F4F5F7; color:var(--ink); font-family:Inter,sans-serif; }
  .card{ width:min(400px, calc(100vw - 32px)); background:#fff; border:1px solid var(--line); padding:36px 32px; border-radius:8px; }
  img{ height:52px; width:auto; display:block; margin:0 auto 18px; }
  h1{ font-family:Fraunces,serif; font-size:26px; text-align:center; margin:0 0 6px; }
  p{ text-align:center; color:var(--soft); font-size:14px; margin:0 0 22px; }
  label{ display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--soft); margin:0 0 6px; }
  input{ width:100%; border:1px solid var(--line); background:#fff; padding:12px; font:inherit; margin-bottom:14px; border-radius:6px; }
  input:focus{ outline:2px solid var(--ink); outline-offset:1px; border-color:var(--ink); }
  button{ width:100%; border:0; background:var(--ink); color:#fff; padding:13px; font-weight:600; cursor:pointer; border-radius:6px; }
  .err{ color:var(--bad); font-size:13px; min-height:1.2em; margin-top:10px; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <img src="../assets/caza-logo-dark.png" alt="CAZA FINNANCIAL">
    <h1>Office desk</h1>
    <p>Leads, appointments, and branded email.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="btn">Sign in</button>
    <div class="err" id="err"></div>
  </form>
<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
  const SB = "https://jtifhcvbgxqwlywugvjv.supabase.co";
  const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0aWZoY3ZiZ3hxd2x5d3Vndmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MDc5NTgsImV4cCI6MjA4ODA4Mzk1OH0.UfRVLuvM8_HPvKXUEDXb0cxR50znv16L5Tf99AnSc7g";
  const sb = createClient(SB, ANON, { auth: { storageKey: "sb-caza-auth", persistSession: true } });
  const { data: { session } } = await sb.auth.getSession();
  if (session) location.replace("./index.html");
  const err = document.getElementById("err");
  const btn = document.getElementById("btn");
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "Signing in…";
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
    });
    if (error) {
      err.textContent = error.message || "Sign in failed";
      btn.disabled = false;
      btn.textContent = "Sign in";
      return;
    }
    location.replace("./index.html");
  });
</script>
</body>
</html>
